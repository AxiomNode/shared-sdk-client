name: Validate SDK Layout

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sdk folders
        run: |
          test -d typescript
          test -d kotlin
          test -d python
          test -d openapi
          test -d tooling
