name: Validate SDK Layout

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

# Workflow-level permissions are intentionally minimal because this job only
# inspects the repository layout and never publishes or mutates external state.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sdk folders
        run: |
          test -d typescript
          test -d kotlin
          test -d python
          test -d openapi
          test -d tooling
