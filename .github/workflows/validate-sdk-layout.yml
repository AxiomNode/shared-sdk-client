name: Validate SDK Layout

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Workflow-level permissions are intentionally minimal because this job only
# inspects the repository layout and never publishes or mutates external state.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify sdk folders
        run: |
          test -d typescript
          test -d kotlin
          test -d python
          test -d openapi
          test -d tooling
